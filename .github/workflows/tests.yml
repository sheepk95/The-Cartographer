name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]  # ubuntu-latest (26.04) has no Python 3.9 build
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bundled skills match their recorded hashes
        run: python tools/vendor.py verify
      - name: Unit tests (offline, no model calls)
        run: python -m unittest discover -s tests -v
      - name: A regular install carries the bundled skills
        shell: bash
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          librarian --version
          librarian doctor --no-user-skills
          python -c "import subprocess, sys; out = subprocess.run(['librarian', 'list', '--no-user-skills', '--origin', 'bundled'], capture_output=True, text=True, check=True).stdout; n = len(out.splitlines()); print(n, 'bundled skills'); sys.exit(0 if n > 100 else 1)"
