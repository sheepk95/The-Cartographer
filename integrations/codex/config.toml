# Add to ~/.codex/config.toml (or run: codex mcp add the-librarian -- uvx the-librarian mcp)
# Needs uv (https://docs.astral.sh/uv/). After `pipx install the-librarian` you can use command = "librarian",
# args = ["mcp"] instead.
[mcp_servers.the-librarian]
command = "uvx"
args = ["the-librarian", "mcp"]
# The first uvx start downloads the package, so give the server longer than Codex's default 10 seconds to start.
startup_timeout_sec = 60
# An ask is one model call over the whole catalogue (about 30k tokens with the bundled skills), so give the tool room.
tool_timeout_sec = 180
