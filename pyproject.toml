[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-librarian"
version = "0.1.0"
description = "Ask which agent skills fit a task before you start it: one cached model call over the whole skill catalogue, with a checked answer. Find and vet the ones you lack on skills.sh."
readme = "README.md"
requires-python = ">=3.9"
# The code is MIT; the bundled skills keep their own licences (see THIRD_PARTY_NOTICES.md and catalogue/bundled.json).
license = "MIT AND Apache-2.0 AND CC-BY-SA-4.0 AND Unlicense"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["agent skills", "skill.md", "claude code", "codex", "mcp", "model context protocol", "skills", "llm", "agents", "prompt caching", "skills.sh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
api = ["anthropic"]

[project.urls]
# The same URL is PROJECT_URL in the_librarian/__init__.py; keep the two in step.
Homepage = "https://github.com/sheepk95/The-Librarian"
Issues = "https://github.com/sheepk95/The-Librarian/issues"
Changelog = "https://github.com/sheepk95/The-Librarian/blob/main/CHANGELOG.md"

[project.scripts]
librarian = "the_librarian.cli:main"

[tool.setuptools]
# the_librarian.bundle is the repository root, so a regular install (pip install ., pipx, uv tool install) carries the
# bundled skills too. An editable install (pip install -e .) reads them straight from the clone.
packages = ["the_librarian", "the_librarian.bundle"]
package-dir = {"the_librarian.bundle" = "."}
include-package-data = false

[tool.setuptools.package-data]
"the_librarian.bundle" = ["catalogue/bundled.json", "skills/**/*", "skills/**/.*"]
