[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-cartographer"
version = "0.1.1"
description = "Ask which agent skills fit a task before you start it: one cached model call over the whole skill catalogue, with a checked answer. Find and vet the ones you lack on skills.sh."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
# The code is Apache-2.0 (LICENSE, NOTICE); the bundled skills keep their own licences (see THIRD_PARTY_NOTICES.md and catalogue/bundled.json).
license = "Apache-2.0 AND MIT AND CC-BY-SA-4.0 AND Unlicense"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["agent skills", "skill.md", "claude code", "codex", "mcp", "model context protocol", "skills", "llm", "agents", "prompt caching", "skills.sh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
api = ["anthropic"]

[project.urls]
# The same URL is PROJECT_URL in the_cartographer/__init__.py; keep the two in step.
Homepage = "https://github.com/sheepk95/The-Cartographer"
Source = "https://github.com/sheepk95/The-Cartographer"
Issues = "https://github.com/sheepk95/The-Cartographer/issues"
Changelog = "https://github.com/sheepk95/The-Cartographer/blob/main/CHANGELOG.md"

[project.scripts]
cartographer = "the_cartographer.cli:main"
# The same entry point under the package's own name, so `uvx the-cartographer ...` and
# `pipx run the-cartographer ...` work (both run the command named after the package) and MCP clients that launch
# PyPI servers that way find it.
the-cartographer = "the_cartographer.cli:main"

[tool.setuptools]
# the_cartographer.bundle is the repository root, so a regular install (pip install ., pipx, uv tool install)
# carries the bundled skills too. An editable install (pip install -e .) reads them straight from the clone.
packages = ["the_cartographer", "the_cartographer.bundle"]
package-dir = {"the_cartographer.bundle" = "."}
include-package-data = false

[tool.setuptools.package-data]
"the_cartographer.bundle" = ["catalogue/bundled.json", "skills/**/*", "skills/**/.*"]
